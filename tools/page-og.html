<!doctype html>
<!-- Share-image template for tools/page-og.mjs: the page's own photo on the right, its headline on the left in the
     site's type (Bricolage Grotesque with the Instrument Serif yellow word), logo and domain at the foot.
     DATA is filled in by page-og.mjs; ?layout=<slug> picks the page. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1c1a17; }
  #stage { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; transform-origin: 0 0; overflow: hidden; background: oklch(0.18 0.01 60);
    font-family: 'Bricolage Grotesque', sans-serif; color: oklch(0.96 0.01 85); }
  .photo { position: absolute; left: 610px; top: 40px; right: 40px; bottom: 40px; border-radius: 26px; overflow: hidden; border: 1px solid oklch(0.34 0.01 60); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  .text { position: absolute; left: 56px; top: 56px; width: 510px; bottom: 56px; display: flex; flex-direction: column; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: oklch(0.72 0.19 240); }
  h1 { margin-top: 22px; font-weight: 800; letter-spacing: -.045em; line-height: .95; text-wrap: balance; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; color: oklch(0.88 0.19 100); }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 14px; font-size: 21px; font-weight: 600; }
  .foot img { width: 46px; height: 46px; border-radius: 12px; }
  .foot span { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 400; letter-spacing: .1em; color: oklch(0.74 0.01 85); margin-left: 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const DATA = /*DATA*/[];
const slug = new URLSearchParams(location.search).get('layout');
const d = DATA.find((x) => x.slug === slug) || DATA[0];
const words = d.h1.replace(/<[^>]+>/g, '').length;
const size = words > 70 ? 44 : words > 50 ? 50 : words > 34 ? 58 : 66;
document.getElementById('stage').innerHTML = `
  <div class="photo"><img src="${d.img}" alt=""></div>
  <div class="text">
    <div class="eyebrow">${d.eyebrow}</div>
    <h1 style="font-size:${size}px;">${d.h1}</h1>
    <div class="foot"><img src="../../Portfolio redesign and SEO structure/assets/logo-512.png" alt="">Kavin Arulraj <span>KAVINARULRAJ.COM</span></div>
  </div>`;
document.getElementById('stage').style.transform = `scale(${Math.min(1, innerWidth / 1200, innerHeight / 630)})`;
</script>
</body>
</html>

<!doctype html>
<!-- Concept: Kaveri Freight (fictional Chennai logistics firm) shipment dashboard.
     Brief: shipment states legible at a glance, including the empty and error screens nobody designs.
     Photos (Unsplash License, in ./photos, credits in ./photos/CREDITS.md).
     layout = a (coral tracking) | b (violet glass) | c (mono + lime)
     Render: node tools/render-image.mjs image-sources/16-logistics-dashboard/dashboard.html <out.webp> 1200 900 <layout> -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --font: 'Plus Jakarta Sans', sans-serif;
    --page: #ececec; --app: #f7f7f7; --card: #ffffff; --line: #ececec; --ink: #1d1d1f; --muted: #8a8a90;
    --accent: #ef4b45; --accent-soft: #fde4e2; --accent-ink: #ffffff;
    --ok: #1f9d55; --ok-soft: #e1f4e8; --warn: #d98a00; --warn-soft: #fdf0d5; --err: #d93636; --err-soft: #fde2e2;
    --radius: 18px; --chip: 999px; --shadow: 0 1px 2px rgba(0,0,0,.04);
    --nav-bg: transparent; --nav-ink: #1d1d1f; --nav-active: #ef4b45; --nav-active-ink: #fff;
    --load: rgba(239,75,69,.72); --load-cell: rgba(255,255,255,.14);
  }
  body.b {
    --font: 'Manrope', sans-serif;
    --page: #b9b8c4; --app: #e9e9ee; --card: rgba(255,255,255,.72); --line: rgba(0,0,0,.06); --ink: #18181d; --muted: #8b8b97;
    --accent: #7c5cff; --accent-soft: #ece6ff; --accent-ink: #fff;
    --radius: 20px; --shadow: 0 8px 24px rgba(40,30,90,.06);
    --nav-bg: rgba(255,255,255,.6); --nav-ink: #18181d; --nav-active: #ffffff; --nav-active-ink: #18181d;
    --load: rgba(196,176,255,.78); --load-cell: rgba(255,255,255,.35);
  }
  body.c {
    --font: 'Space Grotesk', sans-serif;
    --page: #d9d9d6; --app: #f2f2ef; --card: #ffffff; --line: #e3e3de; --ink: #111111; --muted: #7d7d78;
    --accent: #c6f24e; --accent-soft: #eefbc9; --accent-ink: #111111;
    --radius: 6px; --chip: 4px; --shadow: none;
    --nav-bg: #111111; --nav-ink: #f2f2ef; --nav-active: #c6f24e; --nav-active-ink: #111111;
    --load: rgba(17,17,17,.78); --load-cell: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
  #stage { position: absolute; left: 0; top: 0; width: 1200px; height: 900px; transform-origin: 0 0; overflow: hidden;
    background: var(--page); font-family: var(--font); color: var(--ink); }
  .app { position: absolute; left: 36px; top: 36px; width: 1128px; height: 828px; background: var(--app); border-radius: 26px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.18); display: flex; }
  body.b .app { background: linear-gradient(160deg, #f1f1f5, #e2e1ea); }
  body.c .app { border-radius: 10px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); position: relative; overflow: hidden; }
  body.b .card { backdrop-filter: blur(12px); border-color: rgba(255,255,255,.7); }
  .h { font-weight: 700; font-size: 14px; letter-spacing: -.01em; }
  .mut { color: var(--muted); font-size: 11px; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--chip); white-space: nowrap; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-transit { color: var(--accent); background: var(--accent-soft); }
  body.c .s-transit { color: #111; background: var(--accent); }
  .s-delay { color: var(--warn); background: var(--warn-soft); }
  .s-done { color: var(--ok); background: var(--ok-soft); }
  .s-err { color: var(--err); background: var(--err-soft); }
  .btn { display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; padding: 7px 14px; border-radius: var(--chip); background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  body.c .btn.ghost { border-color: #111; }
  .photo { display: block; object-fit: cover; }
  .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; flex: none; }
  body.c .av { border-radius: 6px; }
  .sk { background: linear-gradient(90deg, #ececec, #f6f6f6, #ececec); border-radius: 6px; height: 10px; }
  body.b .sk { background: linear-gradient(90deg, rgba(124,92,255,.12), rgba(124,92,255,.05), rgba(124,92,255,.12)); }
</style>
</head>
<body>
<div id="stage"><div class="app" id="app"></div></div>
<script>
const L = new URLSearchParams(location.search).get('layout') || 'a';
document.body.className = L;

const icons = {
  grid: '<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
  truck: '<path d="M3 6h11v9H3zM14 9h4l3 3v3h-7zM7 18a1.6 1.6 0 1 0 0 .1M17 18a1.6 1.6 0 1 0 0 .1"/>',
  box: '<path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/>',
  pin: '<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  cloud: '<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9zM4 4l16 16"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
};
const ic = (n, s = 18, sw = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${icons[n]}</svg>`;

/* ---------- navigation ---------- */
const nav = L === 'a' ? `
  <aside style="width:178px; flex:none; padding:24px 16px; display:flex; flex-direction:column; gap:6px; border-right:1px solid var(--line); background:#fff;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">
      <img class="av" src="photos/driver-1.jpg" alt="">
      <div><div class="mut">Hello,</div><div class="h" style="font-size:13px;">Arun</div></div>
    </div>
    ${[['grid','Overview',1],['truck','Shipments',0],['box','Fleet',0],['chart','Analytics',0],['bell','Alerts',0]].map(([i,t,a]) => `
      <div style="display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; font-size:12.5px; font-weight:600; ${a ? 'background:var(--accent); color:#fff;' : 'color:#4a4a50;'}">${ic(i,16)}${t}${t==='Alerts' ? '<span style="margin-left:auto; background:var(--accent); color:#fff; font-size:10px; border-radius:99px; padding:1px 7px;">3</span>' : ''}</div>`).join('')}
    <div class="card" style="margin-top:auto; background:var(--accent); color:#fff; border:none; padding:16px;">
      <div style="font-size:11px; opacity:.85;">Today</div>
      <div style="font-size:26px; font-weight:800; line-height:1.1;">32 trips</div>
      <div style="font-size:11px; opacity:.85; margin-top:4px;">870 km · avg 2h 45</div>
      <div style="margin-top:12px; background:#fff; color:var(--accent); font-size:11px; font-weight:700; text-align:center; padding:7px; border-radius:99px;">+ New request</div>
    </div>
  </aside>` : '';

const topbar = `
  <div style="display:flex; align-items:center; gap:14px; height:54px;">
    ${L !== 'a' ? `<div style="display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px;"><span style="width:26px; height:26px; border-radius:${L==='c'?'4px':'8px'}; background:${L==='c'?'#111':'var(--accent)'}; color:${L==='c'?'var(--accent)':'#fff'}; display:flex; align-items:center; justify-content:center;">${ic('truck',15,2)}</span>Kaveri Freight</div>` : `<div><div class="mut" style="font-size:11px;">Dashboard</div><div style="font-weight:800; font-size:20px; letter-spacing:-.02em;">Shipment tracking</div></div>`}
    ${L !== 'a' ? `<div style="margin-left:auto; margin-right:auto; display:flex; gap:4px; padding:4px; border-radius:${L==='c'?'6px':'14px'}; background:var(--nav-bg);">${['Overview','Shipments','Fleet','Load plan','Reports'].map((t,i) => `<span style="font-size:11.5px; font-weight:600; padding:7px 13px; border-radius:${L==='c'?'4px':'10px'}; ${i===1 ? 'background:var(--nav-active); color:var(--nav-active-ink);' : 'color:var(--nav-ink);'}">${t}</span>`).join('')}</div>` : `<div style="margin-left:auto; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 12px; width:220px; color:var(--muted); font-size:12px;">${ic('search',15)}Search shipment ID</div>`}
    <div style="display:flex; align-items:center; gap:10px;">${ic('bell',18)}<img class="av" src="photos/driver-2.jpg" alt="" style="width:30px; height:30px;"></div>
  </div>`;

/* ---------- hero: truck photo with load overlay ---------- */
const cells = Array.from({length: 18}, (_, i) => i);
const hero = `
  <div class="card" style="grid-area:hero; padding:0;">
    <img class="photo" src="photos/truck-trailer.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-position: 50% 50%;">
    <div style="position:absolute; left:${L==='a' ? '40%' : '47.6%'}; top:${L==='a' ? '24.5%' : '17.5%'}; width:${L==='a' ? '50.5%' : '42.6%'}; height:${L==='a' ? '39.5%' : '50%'}; display:grid; grid-template-columns: repeat(6,1fr); grid-template-rows: repeat(3,1fr); gap:3px; padding:4px; background:var(--load); border-radius:3px;">
      ${cells.map(i => `<div style="background:${(L==='b'||L==='c') && i===8 ? 'var(--accent)' : 'var(--load-cell)'}; border-radius:2px; ${i>14 ? 'opacity:.25' : ''}"></div>`).join('')}
      ${L==='a' ? '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:46px; letter-spacing:-.03em;">82%</div>' : ''}
    </div>
    <div style="position:absolute; left:16px; top:16px; display:flex; flex-direction:column; gap:8px;">
      <div class="card" style="padding:10px 14px; ${L==='c' ? 'background:#111; color:#f2f2ef; border:none;' : ''}">
        <div style="display:flex; align-items:center; gap:10px;"><span class="mono" style="font-weight:600; font-size:13px;">KF-TN09-4471</span><span class="chip s-transit"><i></i>In transit</span></div>
        <div style="font-size:11px; margin-top:6px; ${L==='c' ? 'color:#bdbdb8;' : 'color:var(--muted);'}">Guindy hub → Hosur DC · 286 km</div>
        <div style="height:5px; border-radius:9px; background:${L==='c'?'#333':'var(--line)'}; margin-top:8px;"><div style="width:64%; height:100%; border-radius:9px; background:var(--accent);"></div></div>
      </div>
    </div>
    <div style="position:absolute; right:16px; bottom:16px; display:flex; gap:8px;">
      ${[['Load','14.2 / 18 t'],['Pallets','26'],['ETA','4:40 pm']].map(([k,v]) => `<div class="card" style="padding:8px 12px; ${L==='c' ? 'background:#111; color:#f2f2ef; border:none;' : ''}"><div style="font-size:10px; ${L==='c'?'color:#9a9a95;':'color:var(--muted);'}">${k}</div><div style="font-weight:700; font-size:14px;">${v}</div></div>`).join('')}
    </div>
  </div>`;

/* ---------- route map ---------- */
const route = `
  <div class="card" style="grid-area:route; padding:14px;">
    <div style="display:flex; justify-content:space-between; align-items:center;"><span class="h">Route</span><span class="mono" style="font-size:11px; color:var(--muted);">01:38:47 left</span></div>
    <svg viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" style="position:absolute; left:0; top:40px; width:100%; height:calc(100% - 40px);">
      <rect width="300" height="150" fill="${L==='c' ? '#f5f5f2' : L==='b' ? 'rgba(255,255,255,.4)' : '#f6f4f3'}"/>
      <g stroke="${L==='c' ? '#e2e2dd' : '#e9e6e4'}" stroke-width="6" fill="none"><path d="M0 40 H300"/><path d="M0 110 H300"/><path d="M60 0 V150"/><path d="M180 0 V150"/><path d="M0 150 L120 0"/><path d="M240 0 L300 70"/></g>
      <g fill="${L==='c' ? '#ebebe6' : '#efeceb'}"><rect x="72" y="52" width="40" height="22" rx="3"/><rect x="190" y="52" width="46" height="30" rx="3"/><rect x="200" y="118" width="60" height="24" rx="3"/><rect x="12" y="62" width="34" height="34" rx="3"/></g>
      <path d="M24 112 C 70 106, 82 76, 130 74 S 210 46, 276 40" fill="none" stroke="${L==='c' ? '#111' : 'var(--accent)'}" stroke-width="3" stroke-dasharray="${L==='c' ? '0' : '6 5'}" stroke-linecap="round"/>
      ${[[24,112],[130,74],[276,40]].map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="${i===1?8:6}" fill="${i===1 ? (L==='c'?'#c6f24e':'var(--accent)') : '#fff'}" stroke="${L==='c' ? '#111' : 'var(--accent)'}" stroke-width="3"/>`).join('')}
    </svg>
    <div class="card" style="position:absolute; right:12px; bottom:12px; padding:8px 10px; max-width:150px;">
      <div style="display:flex; gap:6px; align-items:center;"><span class="chip s-delay"><i></i>Slow traffic</span></div>
      <div style="font-size:10px; color:var(--muted); margin-top:4px;">Hosur Rd · +12 min</div>
    </div>
  </div>`;

/* ---------- KPIs ---------- */
const kpi = `
  <div class="card" style="grid-area:kpi; padding:16px; ${L==='a' ? 'background:var(--accent); color:#fff; border:none;' : L==='c' ? 'background:#111; color:#f2f2ef; border:none;' : ''}">
    <div style="font-size:12px; font-weight:600; opacity:.85;">On-time delivery</div>
    <div style="display:flex; align-items:flex-end; gap:12px; margin-top:4px;">
      <div style="font-size:44px; font-weight:800; letter-spacing:-.04em; line-height:1; ${L==='c' ? 'color:var(--accent);' : L==='b' ? 'color:var(--accent);' : ''}">94<span style="font-size:22px;">%</span></div>
      <svg viewBox="0 0 160 50" style="flex:1; height:50px;"><polyline points="0,44 22,32 44,36 66,22 88,26 110,14 132,18 158,4" fill="none" stroke="${L==='a' ? '#fff' : L==='c' ? '#c6f24e' : 'var(--accent)'}" stroke-width="2.5"/>${[[0,44],[66,22],[110,14],[158,4]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="${L==='a' ? 'var(--accent)' : L==='c' ? '#111' : '#fff'}" stroke="${L==='a' ? '#fff' : L==='c' ? '#c6f24e' : 'var(--accent)'}" stroke-width="2"/>`).join('')}</svg>
    </div>
    <div style="font-size:11px; opacity:.75; margin-top:6px;">Target 90% · last 30 days</div>
    <div style="display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:16px;">${[['On route','41'],['Waiting','18'],['In repair','3']].map(([k,v]) => `<div style="border-radius:${L==='c'?'4px':'12px'}; padding:10px 12px; background:${L==='a' ? 'rgba(255,255,255,.16)' : L==='c' ? '#1f1f1f' : 'rgba(124,92,255,.08)'};"><div style="font-size:10.5px; opacity:.8;">${k}</div><div style="font-size:20px; font-weight:800; letter-spacing:-.02em;">${v}</div></div>`).join('')}</div>
  </div>`;

/* ---------- shipments list ---------- */
const rows = [
  ['KF-TN09-4471', 'Guindy → Hosur', 's-transit', 'In transit', '4:40 pm'],
  ['KF-TN22-1180', 'Ennore → Vellore', 's-delay', 'Delayed', '+38 min'],
  ['KF-TN07-9024', 'Ambattur → Sriperumbudur', 's-done', 'Delivered', '11:05 am'],
  ['KF-TN14-3352', 'Tambaram → Chengalpattu', 's-err', 'GPS lost', '14 min ago'],
];
const list = `
  <div class="card" style="grid-area:list; padding:14px 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;"><span class="h">Shipments</span>
      <div style="display:flex; gap:4px;">${['All 72','Active 41','Issues 3'].map((t,i) => `<span style="font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:var(--chip); ${i===0 ? (L==='c' ? 'background:#111; color:#f2f2ef;' : 'background:var(--accent-soft); color:var(--accent);') : 'color:var(--muted);'}">${t}</span>`).join('')}</div></div>
    ${rows.map(([id, r, cls, st, t]) => `
      <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line);">
        <span class="mono" style="font-size:11px; width:96px;">${id}</span>
        <span style="font-size:11.5px; flex:1; color:#4a4a50; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${r}</span>
        <span class="chip ${cls}"><i></i>${st}</span>
        <span style="font-size:11px; color:var(--muted); width:62px; text-align:right;">${t}</span>
      </div>`).join('')}
  </div>`;

/* ---------- cargo photo report ---------- */
const cargo = `
  <div class="card" style="grid-area:cargo; padding:14px 16px;">
    <div style="display:flex; justify-content:space-between; align-items:center;"><span class="h">Cargo photo report</span><span class="mut">KF-TN09-4471</span></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin-top:10px;">
      ${[['rack-boxes.jpg','Loaded · Guindy','50% 50%'],['forklift.jpg','Sealed · 9:12 am','30% 50%'],['','Add photo','']].map(([p,c,pos]) => p ? `
        <div><img class="photo" src="photos/${p}" alt="" style="width:100%; height:84px; border-radius:${L==='c'?'4px':'10px'}; object-position:${pos};"><div style="font-size:10px; margin-top:5px; color:var(--muted);">● ${c}</div></div>` : `
        <div style="height:84px; border:1.5px dashed ${L==='c'?'#111':'var(--accent)'}; border-radius:${L==='c'?'4px':'10px'}; display:flex; flex-direction:column; align-items:center; justify-content:center; color:${L==='c'?'#111':'var(--accent)'}; font-size:10.5px; font-weight:700; gap:4px;">${ic('box',18)}${c}</div>`).join('')}
    </div>
  </div>`;

/* ---------- states: the screens nobody designs ---------- */
const states = `
  <div style="grid-area:states; display:grid; grid-template-columns: 1.15fr 1.15fr 1fr 1fr; gap:14px;">
    <div class="card" style="padding:14px; display:flex; gap:12px; align-items:center;">
      <div style="position:relative; width:74px; height:74px; flex:none; border-radius:${L==='c'?'6px':'16px'}; overflow:hidden;"><img class="photo" src="photos/rack-boxes.jpg" alt="" style="width:100%; height:100%; filter: grayscale(1) contrast(.8); opacity:.45;"></div>
      <div><div class="mut" style="text-transform:uppercase; letter-spacing:.12em; font-size:9px;">Empty state</div><div class="h" style="font-size:13px; margin-top:2px;">No shipments today</div><div class="mut" style="margin:3px 0 8px;">Book a pickup and it shows up here.</div><span class="btn">Book pickup</span></div>
    </div>
    <div class="card" style="padding:14px; display:flex; gap:12px; align-items:center; border-color:var(--err-soft);">
      <div style="width:74px; height:74px; flex:none; border-radius:${L==='c'?'6px':'16px'}; background:var(--err-soft); color:var(--err); display:flex; align-items:center; justify-content:center;">${ic('cloud',30,2)}</div>
      <div><div class="mut" style="text-transform:uppercase; letter-spacing:.12em; font-size:9px; color:var(--err);">Error state</div><div class="h" style="font-size:13px; margin-top:2px;">GPS signal lost</div><div class="mut" style="margin:3px 0 8px;">Last seen Tambaram, 14 min ago.</div><span class="btn ghost">Call driver</span></div>
    </div>
    <div class="card" style="padding:14px;">
      <div class="mut" style="text-transform:uppercase; letter-spacing:.12em; font-size:9px;">Loading</div>
      <div style="display:flex; gap:10px; align-items:center; margin-top:10px;"><div class="sk" style="width:34px; height:34px; border-radius:50%;"></div><div style="flex:1;"><div class="sk" style="width:80%;"></div><div class="sk" style="width:55%; margin-top:6px;"></div></div></div>
      <div class="sk" style="width:100%; height:22px; margin-top:12px;"></div>
    </div>
    <div class="card" style="padding:14px;">
      <div class="mut" style="text-transform:uppercase; letter-spacing:.12em; font-size:9px; color:var(--ok);">Delivered</div>
      <div style="display:flex; gap:10px; align-items:center; margin-top:8px;"><img class="av" src="photos/driver-2.jpg" alt=""><div><div class="h" style="font-size:12.5px;">Murugan S.</div><div class="mut">Signed 11:05 am</div></div></div>
      <div style="display:flex; gap:6px; margin-top:10px;"><span class="chip s-done"><i></i>POD received</span></div>
    </div>
  </div>`;

/* ---------- assemble ---------- */
document.getElementById('app').innerHTML = `
  ${nav}
  <div style="flex:1; padding:${L==='a' ? '18px 24px 22px' : '14px 24px 22px'}; display:flex; flex-direction:column; gap:14px; min-width:0;">
    ${topbar}
    <div style="flex:1; display:grid; gap:14px; min-height:0;
      grid-template-columns: 1.6fr 1fr;
      grid-template-rows: 358px 1fr 132px;
      grid-template-areas: 'hero side' 'list kpi' 'states states';">
      ${hero}
      <div style="grid-area:side; display:grid; grid-template-rows: 1fr 1fr; gap:14px; min-height:0;">${route.replace('grid-area:route;','')}${cargo.replace('grid-area:cargo;','')}</div>
      ${list}${kpi}
      ${states}
    </div>
  </div>`;

const k = Math.min(1, innerWidth / 1200, innerHeight / 900);
document.getElementById('stage').style.transform = `scale(${k})`;
</script>
</body>
</html>

<!doctype html>
<!-- Concept: "Velan Auto Spares" (fictional auto parts distributor) bilingual wordmark on fascia and rolling shutter.
     Render: node tools/render-image.mjs image-sources/03-auto-parts/shopfront.html <out.webp> 1000 1000 -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --red: #c8282e;
    --red-d: #9e1c22;
    --yellow: #f6c21c;
    --black: #161616;
    --white: #f7f4ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #ccd9e2; }
  #stage { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; transform-origin: 0 0; overflow: hidden;
    font-family: 'Anek Tamil', sans-serif; }
  .abs { position: absolute; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .sky { position: absolute; inset: 0 0 auto 0; height: 260px; background: linear-gradient(#9fc3dc, #d9e6ec); }
  .wall { position: absolute; left: 0; right: 0; top: 120px; height: 760px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 34px),
      linear-gradient(#e3ddd2, #d6cfc2); }
  .parapet { position: absolute; left: 30px; right: 30px; top: 120px; height: 40px; background: #cfc7b9; border-bottom: 4px solid #b9b0a1; }

  /* fascia */
  .fascia { left: 50px; right: 50px; top: 175px; height: 170px; background: var(--black); border-radius: 4px;
    box-shadow: 0 14px 26px rgba(0,0,0,.28); display: flex; align-items: center; padding: 0 34px; gap: 26px; overflow: hidden; }
  .fascia::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.07), transparent 40%); pointer-events: none; }
  .fascia .band { position: absolute; right: 0; top: 0; bottom: 0; width: 120px; background: var(--red);
    clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%); }
  .fascia .band::before { content: ""; position: absolute; left: 14%; top: 0; bottom: 0; width: 18px; background: var(--yellow); transform: skewX(-13deg); }
  .ta { font-weight: 800; font-stretch: 100%; color: var(--yellow); line-height: 1.05; }
  .en { font-weight: 800; font-stretch: 112%; color: var(--white); letter-spacing: .01em; line-height: 1; }

  /* lights */
  .lamp { position: absolute; top: 160px; width: 34px; height: 12px; border-radius: 0 0 8px 8px; background: #2a2a2a; }
  .lamp::after { content: ""; position: absolute; left: -40px; top: 10px; width: 114px; height: 120px;
    background: radial-gradient(ellipse at 50% 0, rgba(255,240,200,.35), transparent 70%); }

  /* opening + shutter */
  .pillar { position: absolute; top: 345px; height: 540px; width: 70px; background: linear-gradient(90deg, #2a2a2a, #3a3a3a 60%, #242424); }
  .box { position: absolute; left: 120px; right: 120px; top: 345px; height: 42px; background: #2e2e2e; }
  .shutter { position: absolute; left: 120px; right: 120px; top: 387px; height: 498px; overflow: hidden;
    background: linear-gradient(110deg, #34343a 0%, #2a2a30 100%); }
  .shutter .slats { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.10) 0 2px, rgba(0,0,0,.0) 2px 13px, rgba(0,0,0,.32) 13px 16px); }
  .shutter .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #1d1d1d; z-index: 6; }
  .stripe { position: absolute; top: -40px; bottom: -40px; transform: skewX(-20deg); }

  .ground { position: absolute; left: 0; right: 0; top: 885px; bottom: 0;
    background: repeating-linear-gradient(90deg, #b9b3a8 0 98px, #a9a397 98px 100px), #b9b3a8; }
  .ground::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: #9b9488; }
  .bollard { position: absolute; top: 820px; width: 26px; height: 78px; border-radius: 6px 6px 0 0;
    background: repeating-linear-gradient(180deg, var(--yellow) 0 18px, var(--black) 18px 30px); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <!-- Mark: hex nut with a vel (spear) cut through. Solid shapes only: cuttable in vinyl. -->
  <symbol id="mark" viewBox="0 0 100 100">
    <path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" fill="var(--fill, #f6c21c)"/>
    <path d="M50 14 C 60 30, 64 42, 58 52 L 55 56 L 55 84 L 45 84 L 45 56 L 42 52 C 36 42, 40 30, 50 14 Z" fill="var(--cut, #161616)"/>
    <rect x="34" y="58" width="32" height="8" rx="2" fill="var(--cut, #161616)"/>
  </symbol>
  <symbol id="gear" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="7">
      <circle cx="50" cy="50" r="28"/>
      <circle cx="50" cy="50" r="10"/>
    </g>
    <g fill="currentColor">
      <rect x="44" y="4" width="12" height="16" rx="2"/><rect x="44" y="80" width="12" height="16" rx="2"/>
      <rect x="4" y="44" width="16" height="12" rx="2"/><rect x="80" y="44" width="16" height="12" rx="2"/>
      <rect x="44" y="4" width="12" height="16" rx="2" transform="rotate(45 50 50)"/><rect x="44" y="80" width="12" height="16" rx="2" transform="rotate(45 50 50)"/>
      <rect x="4" y="44" width="16" height="12" rx="2" transform="rotate(45 50 50)"/><rect x="80" y="44" width="16" height="12" rx="2" transform="rotate(45 50 50)"/>
    </g>
  </symbol>
</svg>

<div id="stage">
  <div class="sky"></div>
  <div class="wall"></div>
  <div class="parapet"></div>

  <!-- fascia board -->
  <div class="abs fascia">
    <div class="band"></div>
    <svg width="120" height="120" style="flex:none; position:relative; z-index:1;"><use href="#mark"/></svg>
    <div style="position:relative; z-index:1;">
      <div class="ta" style="font-size:36px;">வேலன் ஆட்டோ ஸ்பேர்ஸ்</div>
      <div class="en" style="font-size:52px; font-stretch:106%; margin-top:6px;">VELAN AUTO SPARES</div>
      <div class="mono" style="font-size:12px; letter-spacing:.24em; color:#bdb7ad; margin-top:10px;">WHOLESALE · RETAIL · SINCE 1991</div>
    </div>
  </div>
  <div class="lamp" style="left:180px;"></div>
  <div class="lamp" style="left:483px;"></div>
  <div class="lamp" style="left:786px;"></div>

  <!-- opening -->
  <div class="pillar" style="left:50px;"></div>
  <div class="pillar" style="right:50px;"></div>
  <div class="box"></div>

  <div class="shutter">
    <!-- painted artwork, flat colours only -->
    <div class="stripe" style="left:430px; width:150px; background:var(--red);"></div>
    <div class="stripe" style="left:595px; width:40px; background:var(--yellow);"></div>
    <div class="stripe" style="left:650px; width:14px; background:var(--white); opacity:.9;"></div>

    <div class="abs" style="left:-70px; top:160px; color:#45454c;"><svg width="380" height="380"><use href="#gear"/></svg></div>

    <div class="abs" style="left:40px; top:44px;">
      <svg width="150" height="150"><use href="#mark"/></svg>
    </div>
    <div class="abs" style="left:205px; top:62px;">
      <div class="ta" style="font-size:34px;">வேலன்</div>
      <div class="en" style="font-size:88px; font-stretch:118%; line-height:.9;">VELAN</div>
      <div class="en" style="font-size:22px; font-stretch:100%; color:var(--yellow); margin-top:12px; letter-spacing:.06em;">CAR · BIKE · TRUCK</div>
    </div>

    <div class="abs" style="left:40px; top:250px; width:360px;">
      <div class="en" style="font-size:30px; font-stretch:108%; color:var(--yellow); line-height:1.25;">BEARINGS<br>FILTERS<br>BRAKES<br>CLUTCH PLATES</div>
      <div class="ta" style="font-size:20px; color:#d9d4cb; margin-top:12px; font-weight:700;">பேரிங் · ஃபில்டர் · பிரேக் · கிளட்ச்</div>
    </div>


    <div class="slats"></div>
    <div class="bottom"></div>
  </div>

  <div class="ground"></div>
  <div class="bollard" style="left:20px;"></div>
  <div class="bollard" style="right:20px;"></div>

  <div class="abs mono" style="left:60px; top:948px; font-size:12px; letter-spacing:.2em; color:#5d574e;">VELAN AUTO SPARES — SIGNAGE CONCEPT</div>
  <div class="abs mono" style="right:60px; top:948px; font-size:12px; letter-spacing:.14em; color:#5d574e;">3 FLAT COLOURS · CUT VINYL</div>
</div>
<script>
  const k = Math.min(1, innerWidth / 1000, innerHeight / 1000);
  document.getElementById('stage').style.transform = `scale(${k})`;
</script>
</body>
</html>

<!doctype html>
<!-- Velan Auto Spares signage on real photos: painted rolling shutter, fascia board over a real shopfront
     (its original shop sign fully covered), roadside hoarding. Replaces the drawn shopfront.html.
     Photos (Unsplash License, in ./photos, credits in ./photos/CREDITS.md).
     Render: node tools/render-image.mjs image-sources/03-auto-parts/photo-shopfront.html <out.webp> 1000 1000 -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Tamil:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --red: #c8282e; --yellow: #f6c21c; --black: #161616; --white: #f7f4ee; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1b1815; }
  #stage { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; transform-origin: 0 0; overflow: hidden; background: #1b1815;
    display: grid; gap: 10px; grid-template-columns: 495px 495px; grid-template-rows: 600px 390px; grid-template-areas: 'a a' 'b c'; font-family: 'Anek Tamil', sans-serif; }
  .tile { position: relative; overflow: hidden; }
  .scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .scene > img { position: absolute; left: 0; top: 0; display: block; }
  .print { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .ink { mix-blend-mode: multiply; }
  .chip { position: absolute; left: 14px; bottom: 14px; z-index: 3; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
          color: #fff; background: rgba(20,18,16,.62); padding: 6px 10px; border-radius: 6px; }
  .ta { font-weight: 800; font-stretch: 100%; line-height: 1.05; }
  .en { font-weight: 800; font-stretch: 112%; letter-spacing: .01em; line-height: .95; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="0 0 100 100">
    <path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" fill="var(--fill, #f6c21c)"/>
    <path d="M50 14 C 60 30, 64 42, 58 52 L 55 56 L 55 84 L 45 84 L 45 56 L 42 52 C 36 42, 40 30, 50 14 Z" fill="var(--cut, #161616)"/>
    <rect x="34" y="58" width="32" height="8" rx="2" fill="var(--cut, #161616)"/>
  </symbol>
</svg>
<div id="stage"></div>
<script>
function quad(w, h, [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]) {
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1, g = (dx3 * dy2 - dx2 * dy3) / den, k = (dx1 * dy3 - dx3 * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + k * x3, d = y1 - y0 + g * y1, e = y3 - y0 + k * y3;
  return `matrix3d(${a / w},${d / w},0,${g / w},${b / h},${e / h},0,${k / h},0,0,1,0,${x0},${y0},0,1)`;
}
const on = (w, h, pts, html, cls = 'ink', extra = '') => `<div class="print ${cls}" style="width:${w}px; height:${h}px; transform:${quad(w, h, pts)}; ${extra}">${html}</div>`;
const mark = (s, fill = '#f6c21c', cut = '#161616') => `<svg width="${s}" height="${s}" style="--fill:${fill}; --cut:${cut}; flex:none;"><use href="#mark"/></svg>`;

const P = {
  /* paint printed with multiply so the slats and dirt of the real yellow shutter show through */
  shutter: { src: 'rolling-yellow.jpg', w: 1600, h: 1200, label: 'Painted shutter',
    prints: on(1055, 1005, [[283,56],[1338,56],[1338,1060],[283,1060]], `
      <div style="position:absolute; left:60px; top:70px; display:flex; align-items:center; gap:34px;">
        ${mark(250, '#161616', '#f6c21c')}
        <div><div class="ta" style="font-size:74px; color:#c8282e;">வேலன்</div><div class="en" style="font-size:210px; color:#161616;">VELAN</div></div>
      </div>
      <div style="position:absolute; left:64px; top:388px; width:930px; height:34px; background:#c8282e;"></div>
      <div class="en" style="position:absolute; left:64px; top:448px; font-size:70px; font-stretch:100%; color:#161616;">AUTO SPARES</div>
      <div class="en" style="position:absolute; left:66px; top:548px; font-size:40px; font-stretch:105%; color:#c8282e; line-height:1.3;">BEARINGS · FILTERS · BRAKES · CLUTCH</div>
      <div class="ta" style="position:absolute; left:66px; top:614px; font-size:32px; color:#161616;">பேரிங் · ஃபில்டர் · பிரேக் · கிளட்ச்</div>
      <div class="en" style="position:absolute; right:60px; top:690px; font-size:46px; font-stretch:100%; color:#161616;">CAR · BIKE · TRUCK</div>`) },
  /* opaque fascia board mounted over the real shop's sign */
  fascia: { src: 'store-awning.jpg', w: 1600, h: 2400, label: 'Fascia board',
    prints: on(724, 395, [[444,596],[1166,596],[1166,990],[444,990]], `
      <div style="position:absolute; inset:0; background:#161616; border:8px solid #2b2b2b; display:flex; align-items:center; gap:24px; padding:0 34px; overflow:hidden;">
        <div style="position:absolute; right:-10px; top:0; bottom:0; width:120px; background:#c8282e; transform:skewX(-12deg);"></div>
        <div style="position:absolute; right:94px; top:0; bottom:0; width:20px; background:#f6c21c; transform:skewX(-12deg);"></div>
        ${mark(170)}
        <div style="position:relative;"><div class="ta" style="font-size:54px; color:#f6c21c;">வேலன் ஆட்டோ</div><div class="en" style="font-size:96px; color:#f7f4ee;">VELAN</div>
          <div class="en" style="font-size:30px; font-stretch:100%; color:#f7f4ee; letter-spacing:.18em; margin-top:6px;">AUTO SPARES</div></div>
      </div>
      <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,240,200,.10), rgba(0,0,0,.18));"></div>`, '', 'filter: sepia(.18) saturate(.9) brightness(.92);') },
  hoarding: { src: 'billboard-rect.jpg', w: 1600, h: 1067, label: 'Roadside hoarding',
    prints: on(520, 760, [[466,331],[978,109],[978,693],[467,853]], `
      <div style="position:absolute; inset:0; background:#f6c21c;">
        <div style="position:absolute; left:0; right:0; top:0; height:300px; background:#161616;"></div>
        <div style="position:absolute; left:40px; top:44px;">${mark(150)}</div>
        <div class="en" style="position:absolute; left:40px; top:210px; font-size:64px; color:#f7f4ee;">VELAN</div>
        <div class="en" style="position:absolute; left:40px; top:330px; font-size:84px; font-stretch:100%; color:#161616; line-height:.95;">GENUINE<br>SPARES</div>
        <div class="ta" style="position:absolute; left:42px; top:520px; font-size:36px; color:#c8282e;">அசல் உதிரி பாகங்கள்</div>
        <div style="position:absolute; left:0; right:0; bottom:0; height:110px; background:#c8282e; display:flex; align-items:center; padding-left:40px;"><span class="en" style="font-size:40px; font-stretch:100%; color:#fff;">WHOLESALE · RETAIL</span></div>
      </div>`, 'ink') },
};

const tiles = [['shutter', 230, 30, 1160, 'a', 1000], ['fascia', 380, 500, 860, 'b', 495], ['hoarding', 330, 80, 1000, 'c', 495]];
const stage = document.getElementById('stage');
stage.innerHTML = tiles.map(([key, cx, cy, cw, area, tw]) => {
  const p = P[key], s = tw / cw;
  return `<div class="tile" style="grid-area:${area};">
    <div class="scene" style="transform: scale(${s}) translate(${-cx}px, ${-cy}px); width:${p.w}px; height:${p.h}px;">
      <img src="photos/${p.src}" alt="" width="${p.w}" height="${p.h}">${p.prints}
    </div>
    <div class="chip" style="${area === 'a' ? 'left:auto; right:14px;' : ''}">${p.label}</div>
  </div>`;
}).join('');
stage.style.transform = `scale(${Math.min(1, innerWidth / 1000, innerHeight / 1000)})`;
</script>
</body>
</html>

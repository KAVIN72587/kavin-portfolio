<!doctype html>
<!-- Raman & Associates rebrand on real photos: the 1984 letterhead and the 2026 letterhead, each printed onto
     the same real sheet of paper. Replaces the drawn before-after.html.
     Photo (Unsplash License), credits in ./photos/CREDITS.md.
     Render: node tools/render-image.mjs image-sources/06-ca-firm/photo-before-after.html <out.webp> 1440 900 -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --navy: #1d2b5a; --navy-old: #23306b; --maroon: #7a1f2b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #111; }
  #stage { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; overflow: hidden; background: #111;
    display: grid; gap: 10px; grid-template-columns: 715px 715px; }
  .tile { position: relative; overflow: hidden; height: 900px; }
  .scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .scene > img { position: absolute; left: 0; top: 0; display: block; }
  .print { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .ink { mix-blend-mode: multiply; }
  .tag { position: absolute; left: 18px; top: 18px; z-index: 3; font-family: 'Inter Tight'; font-weight: 800; font-size: 26px; letter-spacing: .04em; color: #fff; background: rgba(15,15,15,.72); padding: 8px 14px; border-radius: 8px; }
  .tag.after { background: #f2c94c; color: #111; }
  .note { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 3; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #fff; background: rgba(15,15,15,.7); padding: 10px 14px; border-radius: 8px; line-height: 1.5; }
  .serif { font-family: 'Libre Baskerville', serif; }
  .script { font-family: 'Great Vibes', cursive; }
  .sans { font-family: 'Inter Tight', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .lines span { display: block; height: 4px; border-radius: 2px; margin-bottom: 12px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="old-mark" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#23306b" stroke-width="3"/><circle cx="50" cy="50" r="40" fill="none" stroke="#23306b" stroke-width="1"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#7a1f2b" stroke-width="1" stroke-dasharray="1.5 3"/>
    <text x="50" y="60" text-anchor="middle" font-family="Libre Baskerville" font-weight="700" font-size="26" fill="#23306b">R<tspan font-style="italic" font-weight="400" fill="#7a1f2b" font-size="22">&amp;</tspan>A</text>
    <text x="50" y="80" text-anchor="middle" font-family="Libre Baskerville" font-size="6.5" letter-spacing="1.5" fill="#23306b">EST. 1984</text>
  </symbol>
  <symbol id="new-mark" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="#1d2b5a"/>
    <text x="50" y="64" text-anchor="middle" font-family="Inter Tight" font-weight="800" font-size="40" letter-spacing="-2" fill="#fff">R<tspan fill="#8fb3ff" font-weight="500">&amp;</tspan>A</text>
  </symbol>
</svg>
<div id="stage"></div>
<script>
function quad(w, h, [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]) {
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1, g = (dx3 * dy2 - dx2 * dy3) / den, k = (dx1 * dy3 - dx3 * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + k * x3, d = y1 - y0 + g * y1, e = y3 - y0 + k * y3;
  return `matrix3d(${a / w},${d / w},0,${g / w},${b / h},${e / h},0,${k / h},0,0,1,0,${x0},${y0},0,1)`;
}
const lines = (c) => `<div class="lines">${[30,44,0,96,100,91,97,62,0,100,88,94,40].map(w => w ? `<span style="width:${w}%; background:${c};"></span>` : '<span style="height:18px;"></span>').join('')}</div>`;

/* A4-ish sheet, 600 x 840 */
const OLD = `
  <div style="position:absolute; inset:0; padding:40px 44px;">
    <div style="display:flex; align-items:center; gap:18px; justify-content:center;">
      <svg width="100" height="100"><use href="#old-mark"/></svg>
      <div style="text-align:center;"><div class="serif" style="font-weight:700; font-size:30px; letter-spacing:.12em; color:var(--navy-old);">RAMAN &amp; ASSOCIATES</div>
      <div class="script" style="font-size:36px; color:var(--maroon); line-height:1.1;">Chartered Accountants</div></div>
    </div>
    <div class="serif" style="text-align:center; font-size:11px; line-height:1.6; color:#3b3a3a; margin-top:10px;">"Sri Lakshmi Nilayam", No. 14/2, 3rd Cross Street, Off. Luz Church Road, Mylapore, Madras - 600 004.<br>Phone: 4937xx, 4938xx, 4940xx · Telex: 041-xxxx · Gram: "RAMANCA" · Fax: 4941xx</div>
    <div style="border-top:4px double var(--maroon); border-bottom:1px solid var(--maroon); height:8px; margin:14px 0 20px;"></div>
    <div class="serif" style="display:flex; justify-content:space-between; font-size:12px; color:#3b3a3a;"><span>Ref. No. RA/AUD/84/____</span><span>Date: ___/___/19___</span></div>
    <div style="margin-top:34px;">${lines('#cfc9bd')}</div>
    <div class="serif" style="position:absolute; left:44px; right:44px; bottom:30px; border-top:1px solid var(--maroon); padding-top:8px; text-align:center; font-size:10.5px; color:#5a5450; font-style:italic;">Branches: Tambaram · Madurai · Coimbatore | Partners: S. Raman B.Com., F.C.A. · K. Venkatesh B.Com., A.C.A.</div>
  </div>`;
const NEW = `
  <div style="position:absolute; inset:0; padding:50px 50px;">
    <div style="display:flex; align-items:center; gap:18px;"><svg width="78" height="78"><use href="#new-mark"/></svg>
      <div><div class="sans" style="font-weight:700; font-size:30px; letter-spacing:-.02em; color:var(--navy);">Raman &amp; Associates</div>
      <div class="mono" style="font-size:12px; letter-spacing:.18em; color:#6a7390; margin-top:4px;">CHARTERED ACCOUNTANTS · SINCE 1984</div></div></div>
    <div class="sans" style="display:flex; justify-content:space-between; font-size:13px; color:#6a7390; margin-top:60px;"><span>Ref RA/AUD/26/014</span><span>14 March 2026</span></div>
    <div style="margin-top:34px;">${lines('#d5dbe8')}</div>
    <div style="position:absolute; left:50px; right:50px; bottom:44px; display:flex; justify-content:space-between; align-items:flex-end;">
      <div class="sans" style="font-size:12px; line-height:1.6; color:#55607a;">14/2, 3rd Cross Street, Mylapore<br>Chennai 600 004</div>
      <div class="sans" style="font-size:12px; line-height:1.6; color:#55607a; text-align:right;">+91 44 2499 0000<br>Tambaram · Madurai · Coimbatore</div></div>
    <div style="position:absolute; left:0; right:0; bottom:0; height:12px; background:var(--navy);"></div>
  </div>`;

const SHEET = [[650,325],[1253,497],[1012,1337],[417,1163]];
const tile = (art, which, note, extra) => {
  const [cx, cy, cw] = [260, 150, 1150], s = 715 / cw;
  return `<div class="tile">
    <div class="scene" style="transform: scale(${s}) translate(${-cx}px, ${-cy}px); width:1600px; height:1600px;">
      <img src="photos/sheets-two.jpg" alt="" width="1600" height="1600">
      <div class="print ink" style="width:600px; height:840px; transform:${quad(600, 840, SHEET)}; ${extra}">${art}</div>
    </div>
    <div class="tag ${which}">${which === 'after' ? 'AFTER · 2026' : 'BEFORE · 1984'}</div>
    <div class="note">${note}</div>
  </div>`;
};
const stage = document.getElementById('stage');
stage.innerHTML =
  tile(OLD, 'before', 'Script, three phone numbers, telex and telegram. Cramped and dated.', 'filter: sepia(.25);') +
  tile(NEW, 'after', 'Kept the navy and the R&amp;A initials. Everything else simplified.', '');
stage.style.transform = `scale(${Math.min(1, innerWidth / 1440, innerHeight / 900)})`;
</script>
</body>
</html>

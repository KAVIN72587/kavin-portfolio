<!doctype html>
<!-- Noyyal Weaves identity concept on real photos: the design is printed (perspective-mapped, multiply ink)
     onto a real hang tag, woven shirt label, blank business cards and blank paper.
     Photos (Unsplash License, in ./photos, credits in ./photos/CREDITS.md). Replaces the drawn board.html.
     layout = wide (4:3 branding tile, 1200x900) | square (1:1 main portfolio tile, 1000x1000)
     Render: node tools/render-image.mjs image-sources/01-textile/photo-board.html <out.webp> <w> <h> <layout> -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --indigo: #1f2b5c; --cotton: #efe6d3; --madder: #b5432a; --turmeric: #e3a427; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1b1815; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #1b1815; display: grid; gap: 10px; }
  .tile { position: relative; overflow: hidden; }
  .scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .scene > img { position: absolute; left: 0; top: 0; display: block; }
  .print { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .ink { mix-blend-mode: multiply; }
  .chip { position: absolute; left: 14px; bottom: 14px; z-index: 3; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
          color: #fff; background: rgba(20,18,16,.62); padding: 6px 10px; border-radius: 6px; }
  .serif { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .madras { background:
      repeating-linear-gradient(90deg, rgba(181,67,42,.85) 0 10px, transparent 10px 16px, rgba(227,164,39,.85) 16px 20px, transparent 20px 34px, rgba(31,43,92,.9) 34px 46px, transparent 46px 56px),
      repeating-linear-gradient(0deg, rgba(181,67,42,.6) 0 10px, transparent 10px 16px, rgba(227,164,39,.6) 16px 20px, transparent 20px 34px, rgba(31,43,92,.7) 34px 46px, transparent 46px 56px),
      #efe6d3; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="0 0 48 48">
    <rect x="0" y="0" width="48" height="48" rx="10" fill="currentColor"/>
    <g fill="none" stroke="var(--mark-fg, #efe6d3)" stroke-width="3.6" stroke-linecap="round">
      <path d="M9 16 q 7.5 -6 15 0 t 15 0"/><path d="M9 25 q 7.5 -6 15 0 t 15 0"/><path d="M9 34 q 7.5 -6 15 0 t 15 0"/>
    </g>
    <g stroke="currentColor" stroke-width="5"><line x1="16.5" y1="12" x2="16.5" y2="17"/><line x1="31.5" y1="21" x2="31.5" y2="26"/><line x1="16.5" y1="30" x2="16.5" y2="35"/></g>
  </symbol>
</svg>
<div id="stage"></div>
<script>
function quad(w, h, [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]) {
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  const den = dx1 * dy2 - dx2 * dy1, g = (dx3 * dy2 - dx2 * dy3) / den, k = (dx1 * dy3 - dx3 * dy1) / den;
  const a = x1 - x0 + g * x1, b = x3 - x0 + k * x3, d = y1 - y0 + g * y1, e = y3 - y0 + k * y3;
  return `matrix3d(${a / w},${d / w},0,${g / w},${b / h},${e / h},0,${k / h},0,0,1,0,${x0},${y0},0,1)`;
}
const mark = (s, color = 'var(--indigo)', fg = '#efe6d3') => `<svg width="${s}" height="${s}" style="color:${color}; --mark-fg:${fg}; flex:none;"><use href="#mark"/></svg>`;
const printOn = (w, h, pts, html, cls = 'ink', extra = '') => `<div class="print ${cls}" style="width:${w}px; height:${h}px; transform:${quad(w, h, pts)}; ${extra}">${html}</div>`;

/* ---- real photos + what is printed on them (coordinates in each photo's own pixels) ---- */
const PHOTOS = {
  tag: { src: 'hang-tag.jpg', w: 1600, h: 2133, label: 'Hang tag',
    prints: printOn(380, 760, [[611,861],[987,781],[1181,1509],[800,1600]], `
      <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding-top:150px; color:var(--indigo);">
        ${mark(92)}
        <div class="serif" style="font-size:64px; margin-top:22px;">noyyal</div>
        <div class="mono" style="font-size:13px; letter-spacing:.32em; margin-top:12px;">WEAVES · TIRUPPUR</div>
        <div style="width:150px; height:1.5px; background:var(--indigo); margin:34px 0 18px; opacity:.7;"></div>
        <div style="font-family:Archivo; font-weight:700; font-size:20px; letter-spacing:.06em;">THARI · LOOM LINE</div>
        <div class="mono" style="font-size:12px; letter-spacing:.12em; margin-top:10px; opacity:.85;">100% COTTON · 480 GSM</div>
        <div class="mono" style="font-size:12px; letter-spacing:.12em; margin-top:4px; opacity:.85;">ART 28023 · 70 × 140 CM</div>
      </div>
      <div class="madras" style="position:absolute; left:0; right:0; bottom:0; height:64px;"></div>`) },
  label: { src: 'label-shirt.jpg', w: 1600, h: 1063, label: 'Woven label',
    prints: printOn(350, 196, [[648,627],[994,625],[992,818],[654,822]], `
      <div style="position:absolute; inset:0; background:#e8e1d6; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--indigo);
        background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);">
        <div style="display:flex; align-items:center; gap:10px;">${mark(34)}<span class="serif" style="font-size:44px;">noyyal</span></div>
        <div class="mono" style="font-size:12px; letter-spacing:.2em; margin-top:10px;">100% COMBED COTTON</div>
        <div class="mono" style="font-size:11px; letter-spacing:.2em; margin-top:3px; opacity:.85;">WOVEN IN TIRUPPUR · INDIA</div>
      </div>`, '', 'filter: blur(.9px);') },
  cards: { src: 'cards-blank.jpg', w: 1600, h: 1067, label: 'Business cards',
    prints:
      printOn(520, 296, [[227,415],[680,165],[848,405],[395,655]], `
        <div style="position:absolute; inset:0; background:linear-gradient(135deg,#2a3872,#1f2b5c 55%,#18224a); display:flex; align-items:center; gap:18px; padding:0 44px; color:#efe6d3;">
          ${mark(70, '#efe6d3', '#1f2b5c')}
          <div><div class="serif" style="font-size:58px;">noyyal</div><div class="mono" style="font-size:12px; letter-spacing:.3em; margin-top:8px; color:#e3a427;">WEAVES · TIRUPPUR</div></div>
        </div>
        <div class="madras" style="position:absolute; left:0; right:0; bottom:0; height:22px;"></div>
        <div style="position:absolute; inset:0; background:linear-gradient(120deg, rgba(255,255,255,.14), transparent 40%, rgba(0,0,0,.12));"></div>`, '') +
      printOn(527, 300, [[617,590],[1054,295],[1265,565],[828,860]], `
        <div style="position:absolute; left:40px; top:40px; color:var(--indigo);">
          <div style="font-family:Archivo; font-weight:800; font-size:24px;">Meena Raghavan</div>
          <div class="mono" style="font-size:12px; letter-spacing:.16em; margin-top:6px; color:#b5432a;">EXPORT MERCHANDISING</div>
        </div>
        <div class="mono" style="position:absolute; left:40px; bottom:34px; font-size:12px; line-height:1.8; color:#3a3f55;">Avinashi Road, Tiruppur 641 603<br>+91 421 000 0000 · noyyalweaves.in</div>
        <div style="position:absolute; right:36px; top:36px;">${mark(44)}</div>
        <div class="madras" style="position:absolute; right:0; top:0; bottom:0; width:16px;"></div>`) },
  paper: { src: 'paper-black.jpg', w: 1600, h: 964, label: 'Letterhead',
    prints: printOn(780, 572, [[485,253],[1252,236],[1266,804],[492,848]], `
      <div style="position:absolute; left:84px; top:44px; display:flex; align-items:center; gap:12px; color:var(--indigo);">${mark(46)}<div><div class="serif" style="font-size:40px;">noyyal</div><div class="mono" style="font-size:9.5px; letter-spacing:.3em; margin-top:4px;">WEAVES · TIRUPPUR</div></div></div>
      <div class="mono" style="position:absolute; left:86px; top:124px; font-size:10px; line-height:1.7; color:#55596b;">Noyyal Weaves Pvt. Ltd. · Avinashi Road, Tiruppur 641 603</div>
      <div style="position:absolute; left:86px; top:176px; width:420px;">
        ${[34, 92, 100, 88, 96, 70, 0, 98, 84, 58].map(w => w ? `<span style="display:block; height:4px; width:${w}%; background:#c9c6cf; border-radius:2px; margin-bottom:12px;"></span>` : '<span style="display:block; height:16px;"></span>').join('')}
      </div>
      <div class="madras" style="position:absolute; left:84px; right:250px; bottom:40px; height:14px;"></div>`) },
};

/* ---- tiles: which photo, and which part of it ---- */
const L = new URLSearchParams(location.search).get('layout') || 'wide';
const LAYOUT = L === 'square'
  ? { W: 1000, H: 1000, cols: '495px 495px', rows: '495px 495px', tiles: [['tag', 300, 640, 1200], ['label', 380, 163, 900], ['cards', 190, 40, 1110], ['paper', 410, 40, 920]] }
  : { W: 1200, H: 900, cols: '595px 595px', rows: '445px 445px', tiles: [['tag', 200, 640, 1300], ['label', 250, 166, 1200], ['cards', 150, 80, 1250], ['paper', 300, 60, 1200]] };

const stage = document.getElementById('stage');
stage.style.cssText += `width:${LAYOUT.W}px; height:${LAYOUT.H}px; grid-template-columns:${LAYOUT.cols}; grid-template-rows:${LAYOUT.rows};`;
const tileW = parseInt(LAYOUT.cols);
stage.innerHTML = LAYOUT.tiles.map(([key, cx, cy, cw]) => {
  const p = PHOTOS[key], s = tileW / cw;
  return `<div class="tile">
    <div class="scene" style="transform: scale(${s}) translate(${-cx}px, ${-cy}px); width:${p.w}px; height:${p.h}px;">
      <img src="photos/${p.src}" alt="" width="${p.w}" height="${p.h}">${p.prints}
    </div>
    <div class="chip" style="${L === 'square' ? 'left:18px; bottom:18px;' : ''}">${p.label}</div>
  </div>`;
}).join('');
stage.style.transform = `scale(${Math.min(1, innerWidth / LAYOUT.W, innerHeight / LAYOUT.H)})`;
</script>
</body>
</html>
